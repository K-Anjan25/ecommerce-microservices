server:
  port: 8889
  error:
    include-message: always

file:
  storage:
    path: ${FILE_STORAGE_PATH:${user.home}/ecommerce-product-images}

spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 6MB
  webflux:
    multipart:
      max-in-memory-size: 1MB
      max-disk-usage-per-part: 5MB
      max-parts: 4
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - ${CORS_ALLOWED_ORIGIN:http://localhost:*}
              - https://*.e2b.app
            allowedHeaders: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
      routes:
        # Guest tracking capability is supplied in X-Checkout-Token.
        - id: guest-order-tracking
          uri: ${COMMERCE_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/v1/orders/*/guest
            - Method=GET

        - id: guest-order-cancel
          uri: ${COMMERCE_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/v1/orders/*/guest/cancel
            - Method=POST

        - id: order-service
          uri: ${COMMERCE_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/v1/orders/**
            - Header=Authorization, Bearer .+
          filters:
            - AuthFilter

        # Guest checkout: order creation without a token (no AuthFilter).
        # Must come AFTER the guarded route: logged-in requests carry an
        # Authorization header and match it first, so userId is still injected.
        - id: order-service-guest
          uri: ${COMMERCE_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/v1/orders
            - Method=POST

        - id: cart-service
          uri: ${COMMERCE_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/v1/carts/**
          filters:
            - AuthFilter

        # Provider callbacks authenticate with provider HMAC signatures, not customer JWTs.
        - id: payment-webhooks
          uri: ${COMMERCE_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/v1/payments/webhooks/**
            - Method=POST

        - id: payment-service
          uri: ${COMMERCE_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/v1/payments/**
            - Header=Authorization, Bearer .+
          filters:
            - AuthFilter

        # Guest checkout: payment initiation without a token (no AuthFilter).
        - id: payment-service-guest
          uri: ${COMMERCE_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/v1/payments
            - Method=POST

        - id: coupon-service
          uri: ${COMMERCE_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/v1/coupons/**
          filters:
            - AuthFilter

        - id: wishlist-service
          uri: ${COMMERCE_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/v1/wishlist/**
          filters:
            - AuthFilter

        - id: user-service
          uri: ${USER_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/user/**

        - id: product-write
          uri: ${PRODUCT_SERVICE_URI:http://localhost:8080}
          predicates:
            - Path=/v1/products/**,/v1/categories/**,/v1/comments/**,/v1/store-settings
            - Method=POST,PUT,DELETE
          filters:
            - AuthFilter

        - id: product-read
          uri: ${PRODUCT_SERVICE_URI:http://localhost:8080}
          predicates:
            - Path=/v1/products/**,/v1/categories/**,/v1/comments/**,/v1/store-settings
            - Method=GET

        - id: product-audit
          uri: ${PRODUCT_SERVICE_URI:http://localhost:8080}
          predicates:
            - Path=/v1/product-audit/**
          filters:
            - AuthFilter

        - id: commerce-audit
          uri: ${COMMERCE_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/v1/commerce-audit/**
          filters:
            - AuthFilter

        - id: shipping-service
          uri: ${COMMERCE_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/v1/shipping/**,/v1/tax/**,/v1/returns/**,/v1/addresses/**,/v1/loyalty/**
          filters:
            - AuthFilter

        - id: flash-sale-service
          uri: ${PRODUCT_SERVICE_URI:http://localhost:8080}
          predicates:
            - Path=/v1/flash-sales/**

  main:
    web-application-type: reactive

management:
  endpoints:
    web:
      exposure:
        include: health,info
