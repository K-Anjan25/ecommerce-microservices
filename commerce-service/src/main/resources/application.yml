server:
  port: 8081

spring:
  application:
    name: commerce-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/commerce}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    generate-ddl: true

rabbitmq:
  exchanges:
    internal: order.exchange
    notification: notification.exchange
  queues:
    payment-status: payment.status.queue
  routing-keys:
    payment-status: payment.status.updated
    send-email: send.email.routing-key

payment:
  reconciliation:
    pending-ttl: ${PAYMENT_RECONCILIATION_PENDING_TTL:PT30M}
    scan-delay-ms: ${PAYMENT_RECONCILIATION_SCAN_DELAY_MS:60000}
    batch-size: ${PAYMENT_RECONCILIATION_BATCH_SIZE:100}
    resolved-retention: ${PAYMENT_RECONCILIATION_RESOLVED_RETENTION:P90D}
    retention-scan-delay-ms: ${PAYMENT_RECONCILIATION_RETENTION_SCAN_DELAY_MS:21600000}
  providers:
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

storefront:
  public-url: ${STOREFRONT_PUBLIC_URL:http://localhost:3000}

checkout:
  capability-ttl: ${CHECKOUT_CAPABILITY_TTL:PT720H}

gift-card:
  purchase:
    pending-ttl: ${GIFT_CARD_PURCHASE_PENDING_TTL:PT30M}
    lifecycle-scan-delay-ms: ${GIFT_CARD_PURCHASE_LIFECYCLE_SCAN_DELAY_MS:60000}
    lifecycle-batch-size: ${GIFT_CARD_PURCHASE_LIFECYCLE_BATCH_SIZE:100}

product-service:
  url: ${PRODUCT_SERVICE_URL:http://localhost:8080}

internal-service:
  secret: ${INTERNAL_SERVICE_SECRET:cartly-internal-dev-only}

resilience4j:
  circuitbreaker:
    instances:
      inventoryService:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        sliding-window-size: 10
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      inventoryService:
        timeout-duration: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
