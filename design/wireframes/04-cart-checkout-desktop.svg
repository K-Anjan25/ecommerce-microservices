<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1254" viewBox="0 0 1440 1254">
<rect width="1440" height="1254" fill="#FBF9F4"/>
<g id="frame-label" data-name="frame-label">
<text x="32" y="32" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#221A16" text-anchor="start">04 · Cart -&gt; checkout (desktop, single flow)</text>
<text x="32" y="52" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#6B5E56" text-anchor="start">3-step header · numbered sections (address / delivery / payment / credits / review) · sticky summary</text>
<text x="1408" y="32" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#74675F" text-anchor="end">1440 × 1180</text>
<text x="1408" y="52" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#74675F" text-anchor="end">Cartly 3.0 · evidence-led commerce wireframe</text>
</g>
<g transform="translate(0 74)">
<rect width="1440" height="1180" fill="#F4F0E8" stroke="#C2B5A5"/>
<rect x="0" y="0" width="1440" height="116" rx="0" fill="#FBF9F4" stroke="#DAD0C3" stroke-width="1"/>
<rect x="80" y="34" width="36" height="36" rx="11" fill="#221A16" stroke="#221A16" stroke-width="1"/>
<text x="98" y="58" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#C8A96B" text-anchor="middle">C</text>
<text x="128" y="58" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#221A16" text-anchor="start" letter-spacing="0.18em">CARTLY</text>
<text x="1360" y="58" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#6B5E56" text-anchor="end">Secure checkout  ·  Need help?</text>
<g id="checkout-stepper" data-name="checkout-stepper">
<circle cx="94" cy="162" r="14" fill="#A4472D" stroke="#A4472D"/>
<text x="94" y="167" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">v</text>
<text x="118" y="167" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#A4472D" text-anchor="start">Cart</text>
