</g>
<text x="120" y="112" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#221A16" text-anchor="start" letter-spacing="0.12em">CART     DETAILS     CONFIRMATION</text>
