<g id="annotations" data-name="annotations">
<circle cx="100" cy="130" r="9" fill="#B0455A"/>
<text x="100" y="134" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="115" y="134" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#B0455A" text-anchor="start">Enclosed checkout removes store navigation; logo remains the safe exit</text>
<circle cx="1020" cy="254" r="9" fill="#B0455A"/>
<text x="1020" y="258" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="1035" y="258" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#B0455A" text-anchor="start">Summary is sticky - total always visible, CTA never off-screen</text>
<circle cx="100" cy="1130" r="9" fill="#B0455A"/>
<text x="100" y="1134" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="115" y="1134" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#B0455A" text-anchor="start">Coupon / gift card / loyalty / gift wrap collapse into one credits section</text>
