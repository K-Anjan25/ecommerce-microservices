<text x="146" y="726" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#221A16" text-anchor="start">Payment</text>
<text x="146" y="742" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#74675F" text-anchor="start">Razorpay will open to complete your payment</text>
<rect x="104" y="774" width="426" height="56" rx="10" fill="#F3E2D9" stroke="#A4472D" stroke-width="1"/>
