<text x="1340" y="554" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#221A16" text-anchor="end">Rs 7,891</text>
<rect x="1040" y="574" width="300" height="50" rx="10" fill="#A4472D" stroke="#A4472D" stroke-width="1"/>
<text x="1190" y="603" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FBF9F4" text-anchor="middle">Pay Rs 7,891</text>
<text x="1190" y="648" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="500" fill="#74675F" text-anchor="middle">256-bit secure · PCI compliant</text>
<rect x="1042" y="662" width="72" height="22" rx="11" fill="#FBF9F4" stroke="#C2B5A5" stroke-width="1"/>
<text x="1078" y="677" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#6B5E56" text-anchor="middle">Visa</text>
<rect x="1120" y="662" width="72" height="22" rx="11" fill="#FBF9F4" stroke="#C2B5A5" stroke-width="1"/>
<text x="1156" y="677" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#6B5E56" text-anchor="middle">Mastercard</text>
<rect x="1198" y="662" width="72" height="22" rx="11" fill="#FBF9F4" stroke="#C2B5A5" stroke-width="1"/>
<text x="1234" y="677" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#6B5E56" text-anchor="middle">UPI</text>
<rect x="1276" y="662" width="72" height="22" rx="11" fill="#FBF9F4" stroke="#C2B5A5" stroke-width="1"/>
