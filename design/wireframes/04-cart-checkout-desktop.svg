<text x="146" y="298" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#221A16" text-anchor="start">Delivery address</text>
<text x="146" y="314" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#74675F" text-anchor="start">Guest checkout - no account needed</text>
