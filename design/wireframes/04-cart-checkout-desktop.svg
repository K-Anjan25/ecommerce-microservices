<text x="28" y="53" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#6B5E56" text-anchor="start">Enclosed header · address · delivery · provider-confirmed payment · order-bound credits · summary</text>
