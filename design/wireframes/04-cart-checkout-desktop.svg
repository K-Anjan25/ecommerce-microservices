<text x="120" y="384" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#6B5E56" text-anchor="start">12 Rose Lane, Hyderabad, Telangana</text>
<text x="952" y="376" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#A4472D" text-anchor="end">Apply</text>
<rect x="104" y="410" width="426" height="40" rx="10" fill="#FBF9F4" stroke="#C2B5A5" stroke-width="1"/>
<text x="118" y="434" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#74675F" text-anchor="start">State</text>
<rect x="542" y="410" width="426" height="40" rx="10" fill="#FBF9F4" stroke="#C2B5A5" stroke-width="1"/>
<text x="556" y="434" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#74675F" text-anchor="start">District</text>
<rect x="104" y="460" width="864" height="40" rx="10" fill="#FBF9F4" stroke="#C2B5A5" stroke-width="1"/>
