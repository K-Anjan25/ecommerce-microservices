<text x="394" y="167" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="418" y="167" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#221A16" text-anchor="start">Address &amp; payment</text>
<rect x="570" y="161" width="90" height="2" rx="1" fill="#C2B5A5" stroke="none" stroke-width="1"/>
<circle cx="694" cy="162" r="14" fill="#FBF9F4" stroke="#C2B5A5"/>
<text x="694" y="167" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#74675F" text-anchor="middle">3</text>
<text x="718" y="167" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#74675F" text-anchor="start">Confirmation</text>

</g>
<text x="80" y="214" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#74675F" text-anchor="start" letter-spacing="0.16em">STEP 2 OF 3</text>
<text x="80" y="246" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#221A16" text-anchor="start">Checkout</text>
<g id="s1-address" data-name="s1-address">
