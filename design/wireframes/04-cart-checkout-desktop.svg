<text x="1040" y="440" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#6B5E56" text-anchor="start">Tax (GST 18%)</text>
<text x="1340" y="440" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#221A16" text-anchor="end">Rs 1,214</text>
<text x="1040" y="470" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#6B5E56" text-anchor="start">Gift wrap</text>
<text x="1340" y="470" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#221A16" text-anchor="end">Rs 49</text>
