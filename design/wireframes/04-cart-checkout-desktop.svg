<text x="152" y="652" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" fill="#6B5E56" text-anchor="start">3-5 working days</text>
<text x="516" y="640" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#221A16" text-anchor="end">Free</text>
<rect x="542" y="612" width="426" height="56" rx="10" fill="#FBF9F4" stroke="#C2B5A5" stroke-width="1"/>
<circle cx="568" cy="640" r="13" fill="#E9E2D7"/>
<text x="590" y="636" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#221A16" text-anchor="start">Express</text>
<text x="590" y="652" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" fill="#6B5E56" text-anchor="start">1-2 working days</text>
<text x="954" y="640" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#221A16" text-anchor="end">Rs 100</text>
</g>
<g id="s3-payment" data-name="s3-payment">
