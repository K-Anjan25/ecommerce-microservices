<text x="970" y="426" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#6B5E56" text-anchor="start">GST</text>
<text x="1320" y="426" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#221A16" text-anchor="end">₹577.80</text>
<line x1="970" y1="454" x2="1320" y2="454" stroke="#DAD0C3"/>
