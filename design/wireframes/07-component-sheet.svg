<text x="650" y="884" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="750" fill="#A4472D" text-anchor="start" letter-spacing="0.18em">LAYOUT RULES</text>
<text x="650" y="918" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#221A16" text-anchor="start">• Image-led hierarchy; typography creates rhythm</text>
<text x="650" y="946" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#221A16" text-anchor="start">• Small corner radii; pills only for compact choices/status</text>
<text x="650" y="974" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#221A16" text-anchor="start">• No Browse rail or floating catalog toolbar</text>
<text x="650" y="1002" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#221A16" text-anchor="start">• Checkout is enclosed; server owns every monetary amount</text>
<text x="650" y="1030" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#221A16" text-anchor="start">• Focus, reduced motion, dark mode and en/hi are first-class</text>
