name: cartly

x-jvm-defaults: &jvm-defaults "-XX:+UseSerialGC -XX:MaxRAM=192m -Xmx96m -Xms64m -Xss512k -XX:ActiveProcessorCount=1 -XX:MaxRAMPercentage=50"

x-jvm-tiny: &jvm-tiny "-XX:+UseSerialGC -XX:MaxRAM=128m -Xmx64m -Xms32m -Xss512k -XX:ActiveProcessorCount=1 -XX:MaxRAMPercentage=50"

services:
  postgres:
    image: postgres:15-alpine
    container_name: cartly-postgres
    restart: unless-stopped
    mem_limit: 320m
    cpus: 0.5
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      PGDATA: /data/postgres
    command: ["postgres", "-c", "shared_buffers=96MB", "-c", "work_mem=2MB", "-c", "max_connections=40"]
    volumes:
      - postgres:/data/postgres
      - ./docker/postgres/init-multiple-databases.sql:/docker-entrypoint-initdb.d/init-multiple-databases.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [cartly]

  rabbitmq:
    image: rabbitmq:3.11-management-alpine
    container_name: cartly-rabbitmq
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 20s
    networks: [cartly]

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: cartly-gateway
    restart: unless-stopped
    mem_limit: 160m
    cpus: 0.5
    environment:
      PRODUCT_SERVICE_URI: http://product-service:8080
      COMMERCE_SERVICE_URI: http://commerce-service:8081
      USER_SERVICE_URI: http://user-service:8084
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:*}
      FILE_STORAGE_PATH: /data/product-images
      JAVA_OPTS: *jvm-tiny
    volumes:
      - product-images:/data/product-images
    ports:
      - "8889:8889"
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      commerce-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8889/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 150s
    networks: [cartly]

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: cartly-user-service
    restart: unless-stopped
    mem_limit: 160m
    cpus: 0.5
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/userdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-root}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_OUTBOX_ENCRYPTION_KEY: ${EMAIL_OUTBOX_ENCRYPTION_KEY:-}
      EMAIL_OUTBOX_PUBLISH_DELAY_MS: ${EMAIL_OUTBOX_PUBLISH_DELAY_MS:-30000}
      EMAIL_OUTBOX_BATCH_SIZE: ${EMAIL_OUTBOX_BATCH_SIZE:-50}
      EMAIL_OUTBOX_MAX_ATTEMPTS: ${EMAIL_OUTBOX_MAX_ATTEMPTS:-20}
      EMAIL_OUTBOX_DEAD_RETENTION: ${EMAIL_OUTBOX_DEAD_RETENTION:-P30D}
      EMAIL_OUTBOX_RETENTION_SCAN_DELAY_MS: ${EMAIL_OUTBOX_RETENTION_SCAN_DELAY_MS:-21600000}
      EMAIL_OUTBOX_HEALTH_DEAD_THRESHOLD: ${EMAIL_OUTBOX_HEALTH_DEAD_THRESHOLD:-10}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      SERVER_TOMCAT_THREADS_MAX: "10"
      JAVA_OPTS: *jvm-tiny
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 150s
    networks: [cartly]

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: cartly-product-service
    restart: unless-stopped
    mem_limit: 224m
    cpus: 0.5
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/productdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-root}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      SPRING_RABBITMQ_ADDRESSES: rabbitmq:5672
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-cartly-internal-dev-only}
      SERVER_TOMCAT_THREADS_MAX: "10"
      JAVA_OPTS: *jvm-defaults
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 150s
    networks: [cartly]

  commerce-service:
    build:
      context: .
      dockerfile: commerce-service/Dockerfile
    container_name: cartly-commerce-service
    restart: unless-stopped
    mem_limit: 224m
    cpus: 0.5
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/commercedb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-root}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      PRODUCT_SERVICE_URL: http://product-service:8080
      STOREFRONT_PUBLIC_URL: ${STOREFRONT_PUBLIC_URL:-http://localhost:3000}
      CHECKOUT_CAPABILITY_TTL: ${CHECKOUT_CAPABILITY_TTL:-PT720H}
      PAYMENT_RECONCILIATION_PENDING_TTL: ${PAYMENT_RECONCILIATION_PENDING_TTL:-PT30M}
      PAYMENT_RECONCILIATION_SCAN_DELAY_MS: ${PAYMENT_RECONCILIATION_SCAN_DELAY_MS:-60000}
      PAYMENT_RECONCILIATION_BATCH_SIZE: ${PAYMENT_RECONCILIATION_BATCH_SIZE:-100}
      PAYMENT_RECONCILIATION_RESOLVED_RETENTION: ${PAYMENT_RECONCILIATION_RESOLVED_RETENTION:-P90D}
      PAYMENT_RECONCILIATION_RETENTION_SCAN_DELAY_MS: ${PAYMENT_RECONCILIATION_RETENTION_SCAN_DELAY_MS:-21600000}
      PAYMENT_RECONCILIATION_HEALTH_OPEN_CASE_THRESHOLD: ${PAYMENT_RECONCILIATION_HEALTH_OPEN_CASE_THRESHOLD:-100}
      GIFT_CARD_PURCHASE_PENDING_TTL: ${GIFT_CARD_PURCHASE_PENDING_TTL:-PT30M}
      GIFT_CARD_PURCHASE_LIFECYCLE_SCAN_DELAY_MS: ${GIFT_CARD_PURCHASE_LIFECYCLE_SCAN_DELAY_MS:-60000}
      GIFT_CARD_PURCHASE_LIFECYCLE_BATCH_SIZE: ${GIFT_CARD_PURCHASE_LIFECYCLE_BATCH_SIZE:-100}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-cartly-internal-dev-only}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      SERVER_TOMCAT_THREADS_MAX: "10"
      JAVA_OPTS: *jvm-defaults
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 150s
    networks: [cartly]

networks:
  cartly:
    driver: bridge

volumes:
  postgres:
  product-images:
