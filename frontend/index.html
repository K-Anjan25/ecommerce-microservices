<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/cartly-icon.svg" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0052CC" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://checkout.razorpay.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' ws: wss: https://checkout.razorpay.com https://api.razorpay.com https://api.stripe.com; frame-src 'self' https://checkout.razorpay.com https://api.razorpay.com https://js.stripe.com https://hooks.stripe.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta
      name="description"
      content="Cartly — one modern multi-category marketplace. Shop electronics, fashion, home, beauty and more with secure checkout, tracked delivery, easy returns and rewards."
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Cartly — One modern multi-category marketplace</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <!--ssr-outlet-->
      <!--fallback-start-->
      <!-- Static public fallback for crawlers and JavaScript-disabled clients.
           React replaces this shell after hydration. -->
      <main aria-label="Cartly storefront" style="max-width: 72rem; margin: 0 auto; padding: 4rem 1.5rem; background: #F5F6F8; min-height: 100vh; font-family: Inter, system-ui, sans-serif;">
        <p style="font-size: 0.75rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: #FF5722;">Cartly · Fresh drops every week</p>
        <h1 style="font-family: 'Inter Tight', Inter, system-ui, sans-serif; font-size: clamp(2.75rem, 8vw, 6rem); font-weight: 900; line-height: 0.98; letter-spacing: -0.02em; max-width: 11ch; color: #0F172A; margin: 1rem 0 0;">Explore. Shop. Everything you need.</h1>
        <p style="max-width: 34rem; line-height: 1.7; color: #475569;">One modern multi-category marketplace for high quality tech, home &amp; everyday essentials.</p>
        <p><a href="/products" style="display: inline-block; background: #0052CC; color: #fff; padding: 0.7rem 1.6rem; border-radius: 999px; font-weight: 700; text-decoration: none;">Shop Now</a></p>
      </main>
      <!--fallback-end-->
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
