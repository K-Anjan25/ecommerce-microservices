<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#221A16" />
  <title>Cartly — You’re offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#F4F0E8;color:#221A16;font-family:Inter,system-ui,sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:2rem}.card{width:min(36rem,100%);border-top:1px solid #221A16;padding-top:2.25rem}
    .brand{font-family:Georgia,serif;font-size:1.75rem;letter-spacing:.04em}.eyebrow{margin-top:3rem;color:#A4472D;font-size:.68rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
    h1{font-family:Georgia,serif;font-size:clamp(3rem,9vw,5rem);font-weight:400;line-height:.96;letter-spacing:-.035em;margin:1rem 0}
    p{color:#6B5E56;line-height:1.65;max-width:30rem}button{margin-top:1.5rem;border:0;background:#A4472D;color:#fff;padding:.8rem 1.25rem;font-weight:700;cursor:pointer}
  </style>
</head>
<body><main><section class="card"><div class="brand">CARTLY</div><p class="eyebrow">Connection paused</p><h1>You’re offline.</h1><p>Your bag is safe on this device. Reconnect to browse products, confirm prices, or place an order.</p><button onclick="location.reload()">Try again</button></section></main></body>
</html>
