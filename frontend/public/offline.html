<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0052CC" />
  <title>Cartly — You’re offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#F5F6F8;color:#0F172A;font-family:Inter,system-ui,sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:2rem}.card{width:min(36rem,100%);background:#fff;border:1px solid #E2E8F0;border-radius:1rem;box-shadow:0 8px 20px rgba(15,23,42,.08);padding:2.5rem}
    .brand{font-family:'Inter Tight',Inter,system-ui,sans-serif;font-size:1.6rem;font-weight:900;letter-spacing:-.02em;color:#0052CC}.eyebrow{margin-top:2.5rem;color:#FF5722;font-size:.68rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
    h1{font-family:'Inter Tight',Inter,system-ui,sans-serif;font-size:clamp(2rem,7vw,3rem);font-weight:900;line-height:1.02;letter-spacing:-.02em;margin:.75rem 0}
    p{color:#475569;line-height:1.65;max-width:30rem}button{margin-top:1.5rem;border:0;border-radius:999px;background:#0052CC;color:#fff;padding:.75rem 1.6rem;font-weight:700;cursor:pointer;font-family:inherit}
    button:hover{background:#0747A6}
  </style>
</head>
<body><main><section class="card"><div class="brand">CARTLY</div><p class="eyebrow">Connection paused</p><h1>You’re offline.</h1><p>Your cart is safe on this device. Reconnect to browse products, confirm prices, or place an order.</p><button onclick="location.reload()">Try again</button></section></main></body>
</html>
