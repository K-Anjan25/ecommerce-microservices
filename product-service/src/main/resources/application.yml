server:
  port: 8080

spring:
  application:
    name: product-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/product}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  rabbitmq:
    addresses: ${SPRING_RABBITMQ_ADDRESSES:localhost:5672}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    generate-ddl: true
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:0}
    locations: classpath:db/migration

rabbitmq:
  exchanges:
    notification: notification.exchange
  queues:
    send-email: send.email.queue
  routing-keys:
    send-email: send.email.routing-key

app:
  # Used in customer-facing links (e.g. price-drop alert emails)
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}

internal-service:
  secret: ${INTERNAL_SERVICE_SECRET:cartly-internal-dev-only}

management:
  endpoints:
    web:
      exposure:
        include: health,info
