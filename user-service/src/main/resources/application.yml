server:
  port: 8084
spring:
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/user}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  application:
    name: user-service
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    generate-ddl: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}

jwt:
  secret: ${JWT_SECRET:cartly-dev-secret-change-me-in-production}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}

rabbitmq:
  exchanges:
    internal: notification.exchange
  queues:
    send-email: send.email.queue
  routing-keys:
    send-email: send.email.routing-key

email:
  username: ${EMAIL_USERNAME:}
  password: ${EMAIL_PASSWORD:}
  from-email: ${EMAIL_FROM:}
  outbox:
    # Base64-encoded 32-byte AES key. Required to durably retry failed email.
    encryption-key: ${EMAIL_OUTBOX_ENCRYPTION_KEY:}
    publish-delay-ms: ${EMAIL_OUTBOX_PUBLISH_DELAY_MS:30000}
    batch-size: ${EMAIL_OUTBOX_BATCH_SIZE:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info
